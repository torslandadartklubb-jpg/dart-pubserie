<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dart Domarpanel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: #020617; color: #ffffff; padding: 12px; }

    /* Huvudkort för lagställning */
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 14px; }
    .teams-title { font-size: 18px; font-weight: bold; color: #94a3b8; }
    .main-score { font-size: 40px; font-weight: bold; color: #f59e0b; margin: 4px 0; }

    /* STARTSIDA: Lista med matcher */
    .section-title { font-size: 15px; font-weight: bold; color: #cbd5e1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .match-list { display: flex; flex-direction: column; gap: 8px; }
    .match-item { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; -webkit-appearance: none; text-align: left; width: 100%; color: #fff; }
    .match-item:active { background: #334155; }
    .match-item.finished { border-color: #059669; opacity: 0.7; }
    .match-info-tag { font-size: 12px; font-weight: bold; color: #38bdf8; }
    .match-players { font-size: 15px; font-weight: bold; margin-top: 2px; }
    .match-status { font-size: 14px; font-weight: bold; padding: 6px 12px; border-radius: 6px; background: #2563eb; color: #fff; }
    .match-status.done { background: #059669; }

    /* DOMARVY: Döljs som standard */
    #judge-view { display: none; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .btn-back { background: #334155; color: #cbd5e1; border: none; padding: 8px 14px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }

    /* Spelarboxar & Poäng */
    .players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .player-card { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 10px; text-align: center; position: relative; }
    .player-card.active { border-color: #f59e0b; background: #1e293b; }
    .p-name { font-size: 15px; font-weight: bold; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-legs { font-size: 14px; color: #94a3b8; margin: 2px 0; }
    .p-rem-score { font-size: 42px; font-weight: bold; color: #38bdf8; line-height: 1; margin-top: 6px; }
    .starter-badge { position: absolute; top: 6px; right: 8px; font-size: 11px; color: #fcd34d; font-weight: bold; }

    /* Inmatning & Knappsats */
    .input-display { background: #020617; border: 2px solid #334155; font-size: 32px; font-weight: bold; color: #fcd34d; text-align: center; padding: 8px; border-radius: 8px; margin-bottom: 10px; height: 50px; line-height: 32px; }
    
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .num-btn { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 14px 0; font-size: 22px; font-weight: bold; border-radius: 8px; cursor: pointer; -webkit-appearance: none; }
    .num-btn:active { background: #334155; }
    .btn-clear { background: #7f1d1d; color: #fca5a5; }
    .btn-ok { background: #15803d; color: #86efac; }

    /* Ångra-knapp */
    .action-row { display: flex; justify-content: center; }
    .btn-undo { background: #475569; color: #fff; border: none; padding: 12px 30px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; -webkit-appearance: none; width: 100%; }

    .status-text { text-align: center; font-size: 12px; color: #64748b; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Lag & Huvudställning (Visas alltid högst upp) -->
  <div class="card">
    <div class="teams-title" id="main-teams">Laddar lag...</div>
    <div class="main-score" id="main-score">0 - 0</div>
  </div>

  <!-- STARTSIDA: Välj delmatch -->
  <div id="start-view">
    <div class="section-title">Välj delmatch att döma:</div>
    <div class="match-list" id="match-list-container">
      <!-- Fylls dynamiskt -->
    </div>
  </div>

  <!-- DOMARVY: Visas när en match har valts -->
  <div id="judge-view">
    <div class="top-bar">
      <button class="btn-back" onclick="showStartView()">← Tillbaka till översikt</button>
      <div id="current-submatch-title" style="font-weight: bold; color: #38bdf8;">Delmatch S1</div>
    </div>

    <!-- Spelarnas poängställning i nuvarande leg -->
    <div class="players-grid">
      <div class="player-card" id="card-home" onclick="setTurn('home')">
        <span class="starter-badge" id="badge-home"></span>
        <div class="p-name" id="p-home-name">Spelare Hemma</div>
        <div class="p-legs" id="p-home-legs">Legs: 0</div>
        <div class="p-rem-score" id="p-home-rem">501</div>
      </div>
      <div class="player-card" id="card-away" onclick="setTurn('away')">
        <span class="starter-badge" id="badge-away"></span>
        <div class="p-name" id="p-away-name">Spelare Borta</div>
        <div class="p-legs" id="p-away-legs">Legs: 0</div>
        <div class="p-rem-score" id="p-away-rem">501</div>
      </div>
    </div>

    <!-- Inmatningsskärm för kast -->
    <div class="input-display" id="input-display">0</div>

    <!-- Knappsats -->
    <div class="numpad">
      <button class="num-btn" onclick="pressNum('1')">1</button>
      <button class="num-btn" onclick="pressNum('2')">2</button>
      <button class="num-btn" onclick="pressNum('3')">3</button>
      <button class="num-btn" onclick="pressNum('4')">4</button>
      <button class="num-btn" onclick="pressNum('5')">5</button>
      <button class="num-btn" onclick="pressNum('6')">6</button>
      <button class="num-btn" onclick="pressNum('7')">7</button>
      <button class="num-btn" onclick="pressNum('8')">8</button>
      <button class="num-btn" onclick="pressNum('9')">9</button>
      <button class="num-btn btn-clear" onclick="clearNum()">C</button>
      <button class="num-btn" onclick="pressNum('0')">0</button>
      <button class="num-btn btn-ok" onclick="submitThrow()">OK</button>
    </div>

    <!-- Ångra senast registrerat kast -->
    <div class="action-row">
      <button class="btn-undo" onclick="undoLastThrow()">↺ Ångra Senaste Kast</button>
    </div>
  </div>

  <div class="status-text" id="status-bar">Status: Synkar...</div>

  <script>
    var SUPABASE_URL = 'https://luznainkmcogcqbuprzw.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_6psZleJBdhdZFhUTutZqnw_Rr4Y2SI6';

    var IMPOSSIBLE_SCORES = [163, 166, 169, 172, 173, 175, 176, 178, 179];

    var fullMatchData = null;
    var activeSubIndex = null;
    var currentTurn = 'home'; 
    var currentInput = '';

    function isValidDartScore(score) {
      if (score < 0 || score > 180) return false;
      for (var i = 0; i < IMPOSSIBLE_SCORES.length; i++) {
        if (IMPOSSIBLE_SCORES[i] === score) return false;
      }
      return true;
    }

    function apiCall(method, endpoint, body, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, SUPABASE_URL + endpoint, true);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
      xhr.setRequestHeader('Content-Type', 'application/json');

      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status >= 200 && xhr.status < 300) {
            var data = xhr.responseText ? JSON.parse(xhr.responseText) : null;
            callback(null, data);
          } else {
            callback('HTTP Error ' + xhr.status, null);
          }
        }
      };
      xhr.send(body ? JSON.stringify(body) : null);
    }

    function loadMatchData() {
      apiCall('GET', '/rest/v1/matches?id=eq.main_match', null, function(err, res) {
        if (!err && res && res.length > 0) {
          fullMatchData = res[0].data;
          renderUI();
          document.getElementById('status-bar').innerText = 'Synkad: ' + new Date().toLocaleTimeString();
        } else {
          document.getElementById('status-bar').innerText = 'Kunde inte hämta data.';
        }
      });
    }

    function getLegStarter(subIndex, homeScore, awayScore) {
      var matchStarter = (subIndex % 2 === 0) ? 'home' : 'away';
      var legCount = (homeScore || 0) + (awayScore || 0);

      if (legCount % 2 === 0) {
        return matchStarter;
      } else {
        return (matchStarter === 'home') ? 'away' : 'home';
      }
    }

    function renderUI() {
      if (!fullMatchData) return;

      // Huvudställning
      document.getElementById('main-teams').innerText = fullMatchData.homeTeam + ' vs ' + fullMatchData.awayTeam;
      
      var homeWins = 0;
      var awayWins = 0;
      var subMatches = fullMatchData.subMatches || [];

      for (var i = 0; i < subMatches.length; i++) {
        if (subMatches[i].homeScore === 3) homeWins++;
        if (subMatches[i].awayScore === 3) awayWins++;
      }
      document.getElementById('main-score').innerText = homeWins + ' - ' + awayWins;

      // Rendera lista på startsidan
      var listContainer = document.getElementById('match-list-container');
      listContainer.innerHTML = '';

      for (var j = 0; j < subMatches.length; j++) {
        var sm = subMatches[j];
        var isFinished = (sm.homeScore >= 3 || sm.awayScore >= 3);

        var btn = document.createElement('button');
        btn.className = 'match-item' + (isFinished ? ' finished' : '');
        btn.setAttribute('onclick', 'selectSubMatch(' + j + ')');

        var infoDiv = document.createElement('div');
        infoDiv.innerHTML = '<div class="match-info-tag">Delmatch ' + (j + 1) + ' (S' + (j + 1) + ')</div>' +
                            '<div class="match-players">' + (sm.homePlayer || 'Hemma') + ' vs ' + (sm.awayPlayer || 'Borta') + '</div>';

        var statusDiv = document.createElement('div');
        statusDiv.className = 'match-status' + (isFinished ? ' done' : '');
        statusDiv.innerText = (sm.homeScore || 0) + ' - ' + (sm.awayScore || 0) + (isFinished ? ' (KLAR)' : '');

        btn.appendChild(infoDiv);
        btn.appendChild(statusDiv);
        listContainer.appendChild(btn);
      }

      // Rendera aktiv domarvy om en match är vald
      if (activeSubIndex !== null) {
        var activeSub = subMatches[activeSubIndex] || {};
        document.getElementById('current-submatch-title').innerText = 'Delmatch ' + (activeSubIndex + 1) + ' (S' + (activeSubIndex + 1) + ')';
        
        document.getElementById('p-home-name').innerText = activeSub.homePlayer || fullMatchData.homeTeam;
        document.getElementById('p-away-name').innerText = activeSub.awayPlayer || fullMatchData.awayTeam;
        document.getElementById('p-home-legs').innerText = 'Legs: ' + (activeSub.homeScore || 0);
        document.getElementById('p-away-legs').innerText = 'Legs: ' + (activeSub.awayScore || 0);

        var homeThrows = activeSub.homeThrows || [];
        var awayThrows = activeSub.awayThrows || [];

        var homeSum = 0;
        for (var k = 0; k < homeThrows.length; k++) homeSum += homeThrows[k];
        
        var awaySum = 0;
        for (var l = 0; l < awayThrows.length; l++) awaySum += awayThrows[l];

        document.getElementById('p-home-rem').innerText = 501 - homeSum;
        document.getElementById('p-away-rem').innerText = 501 - awaySum;

        var legStarter = getLegStarter(activeSubIndex, activeSub.homeScore, activeSub.awayScore);
        document.getElementById('badge-home').innerText = (legStarter === 'home') ? '🎯 START' : '';
        document.getElementById('badge-away').innerText = (legStarter === 'away') ? '🎯 START' : '';

        document.getElementById('card-home').className = 'player-card' + (currentTurn === 'home' ? ' active' : '');
        document.getElementById('card-away').className = 'player-card' + (currentTurn === 'away' ? ' active' : '');
      }
    }

    function selectSubMatch(index) {
      activeSubIndex = index;
      var sm = fullMatchData.subMatches[activeSubIndex] || {};
      currentTurn = getLegStarter(activeSubIndex, sm.homeScore, sm.awayScore);
      
      document.getElementById('start-view').style.display = 'none';
      document.getElementById('judge-view').style.display = 'block';
      clearNum();
      renderUI();
    }

    function showStartView() {
      activeSubIndex = null;
      document.getElementById('judge-view').style.display = 'none';
      document.getElementById('start-view').style.display = 'block';
      renderUI();
    }

    function setTurn(team) {
      currentTurn = team;
      renderUI();
    }

    function pressNum(n) {
      if (currentInput.length < 3) {
        currentInput += n;
        document.getElementById('input-display').innerText = currentInput;
      }
    }

    function clearNum() {
      currentInput = '';
      document.getElementById('input-display').innerText = '0';
    }

    function saveToDatabase(onSuccess) {
      document.getElementById('status-bar').innerText = 'Sparar till TV...';
      apiCall('PATCH', '/rest/v1/matches?id=eq.main_match', { data: fullMatchData }, function(err) {
        if (!err) {
          document.getElementById('status-bar').innerText = 'Uppdaterat i realtid!';
          renderUI();
          if (onSuccess) onSuccess();
        } else {
          document.getElementById('status-bar').innerText = 'Kunde inte spara.';
        }
      });
    }

    function submitThrow() {
      if (!currentInput || activeSubIndex === null) return;

      var sm = fullMatchData.subMatches[activeSubIndex];

      // Spärr: Om matchen redan är slut
      if ((sm.homeScore || 0) >= 3 || (sm.awayScore || 0) >= 3) {
        alert('Delmatchen är redan klar! Återgår till startsidan.');
        showStartView();
        return;
      }

      var scoreVal = parseInt(currentInput, 10);

      if (!isValidDartScore(scoreVal)) {
        alert('Ogiltig dartpoäng! (' + scoreVal + ' går inte att få på 3 pilar eller är över 180)');
        clearNum();
        return;
      }

      if (!sm.homeThrows) sm.homeThrows = [];
      if (!sm.awayThrows) sm.awayThrows = [];

      var homeSum = 0;
      for (var i = 0; i < sm.homeThrows.length; i++) homeSum += sm.homeThrows[i];
      
      var awaySum = 0;
      for (var j = 0; j < sm.awayThrows.length; j++) awaySum += sm.awayThrows[j];

      var currentRem = (currentTurn === 'home') ? (501 - homeSum) : (501 - awaySum);

      // Överpil (Bust)
      if (scoreVal > currentRem || currentRem - scoreVal === 1) {
        alert('Bust / Överpil! 0 poäng.');
        if (currentTurn === 'home') sm.homeThrows.push(0);
        else sm.awayThrows.push(0);
        currentTurn = (currentTurn === 'home') ? 'away' : 'home';
        clearNum();
        saveToDatabase();
      } 
      // Leg-vinst
      else if (scoreVal === currentRem) {
        if (currentTurn === 'home') sm.homeScore = (sm.homeScore || 0) + 1;
        else sm.awayScore = (sm.awayScore || 0) + 1;

        var winnerName = (currentTurn === 'home' ? (sm.homePlayer || 'Hemma') : (sm.awayPlayer || 'Borta'));
        
        // Nollställ kast inför nästa leg
        sm.homeThrows = [];
        sm.awayThrows = [];

        // Om någon nådde 3 legs -> Matchen är slut!
        if (sm.homeScore >= 3 || sm.awayScore >= 3) {
          clearNum();
          saveToDatabase(function() {
            alert('MATCH VUNNEN! ' + winnerName + ' vinner delmatchen med ' + sm.homeScore + ' - ' + sm.awayScore + '!');
            showStartView(); // Återgå till startsidan!
          });
        } else {
          alert('Leg Vinst för ' + winnerName + '!');
          currentTurn = getLegStarter(activeSubIndex, sm.homeScore, sm.awayScore);
          clearNum();
          saveToDatabase();
        }
      } 
      // Vanligt kast
      else {
        if (currentTurn === 'home') sm.homeThrows.push(scoreVal);
        else sm.awayThrows.push(scoreVal);

        currentTurn = (currentTurn === 'home') ? 'away' : 'home';
        clearNum();
        saveToDatabase();
      }
    }

    function undoLastThrow() {
      if (activeSubIndex === null) return;
      var sm = fullMatchData.subMatches[activeSubIndex];
      if (currentTurn === 'away' && sm.homeThrows && sm.homeThrows.length > 0) {
        sm.homeThrows.pop();
        currentTurn = 'home';
      } else if (currentTurn === 'home' && sm.awayThrows && sm.awayThrows.length > 0) {
        sm.awayThrows.pop();
        currentTurn = 'away';
      }
      saveToDatabase();
    }

    // Starta
    loadMatchData();
  </script>
</body>
</html>
