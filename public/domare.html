<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dart Domarpanel</title>
  <style>
    /* Förhindra scroll, gummibandseffekter och zoom på touch-enheter */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      background-color: #020617;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
      box-sizing: border-box;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Top Banner */
    .header-card {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .match-info {
      font-size: 14px;
      color: #94a3b8;
    }

    .match-id {
      color: #38bdf8;
      font-weight: bold;
    }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .player-card {
      flex: 1;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .player-card.active {
      border-color: #ffee00;
      box-shadow: 0 0 15px rgba(255, 238, 0, 0.25);
      background: #111e38;
    }

    .player-name {
      font-size: 15px;
      font-weight: bold;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legs-score {
      font-size: 12px;
      color: #22c55e;
      margin-top: 2px;
    }

    .points-left {
      font-size: 42px;
      font-weight: 900;
      color: #ffee00;
      margin: 6px 0;
      line-height: 1;
    }

    /* Display Inmatning */
    .score-input-display {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    /* Nummertangentbord */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex: 1;
    }

    .btn-key {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #fff;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-key:active {
      background: #334155;
      transform: scale(0.98);
    }

    .btn-clear {
      background: #ef4444;
      color: #fff;
    }

    .btn-submit {
      background: #22c55e;
      color: #000;
      grid-column: span 2;
      font-size: 20px;
    }

    /* Modal / Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 6, 23, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      color: #fcd34d;
      margin-bottom: 15px;
    }

    .dart-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-dart {
      flex: 1;
      padding: 16px;
      font-size: 22px;
      font-weight: 900;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      background: #1e293b;
      color: #38bdf8;
      cursor: pointer;
    }

    .btn-dart:active {
      background: #38bdf8;
      color: #000;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Dynamic JS Rendering -->
</div>

<script>
  // State management
  let state = {
    inputValue: '',
    checkoutModal: false,
    checkoutPlayer: null,
    pendingScore: null
  };

  // Mock data/Sync med matcher (Ersätts med ert backend/API-anrop)
  let matchData = {
    currentMatchId: 'S1',
    homeTeam: 'Torslanda',
    awayTeam: 'Borås',
    homePlayer: 'Kalle',
    awayPlayer: 'Pelle',
    homeScore: 1,
    awayScore: 2,
    currentHomePoints: 501,
    currentAwayPoints: 501,
    turn: 'home',
    homeLegDarts: 0,
    awayLegDarts: 0,
    roundsCount: 0
  };

  function render() {
    const app = document.getElementById('app');
    
    // Om checkout-modal ska visas
    if (state.checkoutModal) {
      app.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-content">
            <div class="modal-title">🎯 UTGÅNG INNE!</div>
            <p style="color: #cbd5e1; font-size: 16px;">Hur många pilar användes för utgången?</p>
            <div class="dart-btn-group">
              <button class="btn-dart" onclick="confirmCheckout(1)">1 pil</button>
              <button class="btn-dart" onclick="confirmCheckout(2)">2 pilar</button>
              <button class="btn-dart" onclick="confirmCheckout(3)">3 pilar</button>
            </div>
          </div>
        </div>
      `;
      return;
    }

    // Huvudvy för domaren
    app.innerHTML = `
      <div class="header-card">
        <div class="match-info">
          Match <span class="match-id">${matchData.currentMatchId}</span> — Omgång: ${Math.floor(matchData.roundsCount / 2) + 1}
        </div>
        <div style="font-size: 12px; color: #22c55e; font-weight: bold;">DOMARE</div>
      </div>

      <div class="scoreboard">
        <div class="player-card ${matchData.turn === 'home' ? 'active' : ''}">
          <div class="player-name">${matchData.homePlayer}</div>
          <div class="legs-score">Legs: ${matchData.homeScore}</div>
          <div class="points-left">${matchData.currentHomePoints}</div>
        </div>
        
        <div class="player-card ${matchData.turn === 'away' ? 'active' : ''}">
          <div class="player-name">${matchData.awayPlayer}</div>
          <div class="legs-score">Legs: ${matchData.awayScore}</div>
          <div class="points-left">${matchData.currentAwayPoints}</div>
        </div>
      </div>

      <div class="score-input-display">
        ${state.inputValue || '0'}
      </div>

      <div class="keypad">
        <button class="btn-key" onclick="pressNum('1')">1</button>
        <button class="btn-key" onclick="pressNum('2')">2</button>
        <button class="btn-key" onclick="pressNum('3')">3</button>
        <button class="btn-key" onclick="pressNum('4')">4</button>
        <button class="btn-key" onclick="pressNum('5')">5</button>
        <button class="btn-key" onclick="pressNum('6')">6</button>
        <button class="btn-key" onclick="pressNum('7')">7</button>
        <button class="btn-key" onclick="pressNum('8')">8</button>
        <button class="btn-key" onclick="pressNum('9')">9</button>
        <button class="btn-key btn-clear" onclick="pressBackspace()">C</button>
        <button class="btn-key" onclick="pressNum('0')">0</button>
        <button class="btn-key" style="visibility: hidden;"></button>
        <button class="btn-key btn-submit" onclick="submitScore()">MATTA IN</button>
      </div>
    `;
  }

  function pressNum(num) {
    if (state.inputValue.length < 3) {
      state.inputValue += num;
      if (parseInt(state.inputValue) > 180) state.inputValue = '180';
      render();
    }
  }

  function pressBackspace() {
    state.inputValue = state.inputValue.slice(0, -1);
    render();
  }

  function submitScore() {
    const score = parseInt(state.inputValue) || 0;
    const isHome = matchData.turn === 'home';
    const currentPts = isHome ? matchData.currentHomePoints : matchData.currentAwayPoints;

    // Kollar om utgång (Checkout)
    if (currentPts - score === 0) {
      state.pendingScore = score;
      state.checkoutPlayer = isHome ? 'home' : 'away';
      state.checkoutModal = true;
      render();
      return;
    }

    // Vanlig poäng-registrering
    processTurn(score, false, 0);
  }

  function confirmCheckout(dartsUsed) {
    state.checkoutModal = false;
    processTurn(state.pendingScore, true, dartsUsed);
  }

  function processTurn(score, isCheckout, checkoutDarts) {
    const isHome = matchData.turn === 'home';
    let currentPts = isHome ? matchData.currentHomePoints : matchData.currentAwayPoints;

    // Tjock/Bust
    if (currentPts - score < 2 && currentPts - score !== 0) {
      // Ogiltig utgång/tjock, inga poäng dras av
    } else {
      currentPts -= score;
    }

    if (isHome) {
      matchData.currentHomePoints = currentPts;
      matchData.homeLegDarts += 3;
    } else {
      matchData.currentAwayPoints = currentPts;
      matchData.awayLegDarts += 3;
    }

    // Hantera Leg-vinst vid checkout
    if (isCheckout) {
      if (isHome) matchData.homeScore += 1;
      else matchData.awayScore += 1;

      // Återställ leg
      matchData.currentHomePoints = 501;
      matchData.currentAwayPoints = 501;
      matchData.homeLegDarts = 0;
      matchData.awayLegDarts = 0;
      matchData.roundsCount = 0;
    } else {
      matchData.roundsCount += 1;
    }

    // Växla tur
    matchData.turn = isHome ? 'away' : 'home';

    // Regeltak för Scoring (13 omgångar/39 pilar i leg 1-4, 20 omgångar/60 pilar i 5e leg)
    const isDeciderLeg = (matchData.homeScore === 2 && matchData.awayScore === 2);
    const maxRoundsPerPlayer = isDeciderLeg ? 20 : 13;
    
    // När BÅDA har slutfört sina omgångar (2 x maxRoundsPerPlayer)
    if (matchData.roundsCount >= maxRoundsPerPlayer * 2) {
      alert(`Scoring-fönster triggas! Båda spelarna har slutfört sina ${maxRoundsPerPlayer} omgångar.`);
    }

    state.inputValue = '';
    render();
  }

  // Första renderingen
  render();
</script>
</body>
</html>
