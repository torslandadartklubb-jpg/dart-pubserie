<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dart Domarpanel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; padding: 15px; }

    /* Huvudkort för lagställning */
    .header-card { background: #1e293b; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 15px; border: 1px solid #334155; }
    .match-teams { font-size: 22px; font-weight: bold; color: #f8fafc; }
    .main-score { font-size: 40px; font-weight: bold; color: #f59e0b; margin: 5px 0; }
    
    /* Välj delmatch */
    .section-title { font-size: 16px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .submatches-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .submatch-btn { background: #1e293b; border: 2px solid #334155; color: #fff; padding: 12px; border-radius: 10px; text-align: left; cursor: pointer; -webkit-appearance: none; }
    .submatch-btn.active { border-color: #38bdf8; background: #0284c7; }
    .submatch-btn.finished { border-color: #22c55e; opacity: 0.7; }
    .sm-title { font-size: 14px; color: #cbd5e1; font-weight: bold; }
    .sm-players { font-size: 13px; color: #e2e8f0; margin-top: 4px; }
    .sm-score { font-size: 16px; font-weight: bold; color: #fcd34d; float: right; }

    /* Domarpanel för vald delmatch */
    .referee-box { background: #1e293b; border-radius: 12px; padding: 15px; border: 2px solid #38bdf8; margin-bottom: 15px; display: none; }
    .active-sm-header { font-size: 18px; font-weight: bold; color: #38bdf8; margin-bottom: 10px; text-align: center; }
    
    .leg-scores { display: flex; justify-content: space-around; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .p-box { text-align: center; flex: 1; }
    .p-name { font-size: 15px; font-weight: bold; color: #f8fafc; }
    .p-legs { font-size: 28px; font-weight: bold; color: #fcd34d; }

    /* Tangentbord & inmatning */
    .input-display { background: #0f172a; border: 2px solid #334155; font-size: 36px; font-weight: bold; color: #38bdf8; text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 12px; height: 60px; line-height: 40px; }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .num-btn { background: #334155; color: #fff; border: none; padding: 16px 0; font-size: 22px; font-weight: bold; border-radius: 8px; cursor: pointer; -webkit-appearance: none; }
    .num-btn:active { background: #475569; }
    .btn-clear { background: #991b1b; }
    .btn-ok { background: #16a34a; }

    /* Leg-vinst knappar */
    .leg-win-btns { display: flex; gap: 10px; margin-top: 12px; }
    .btn-win { background: #d97706; color: #fff; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; flex: 1; cursor: pointer; -webkit-appearance: none; }

    .status-text { text-align: center; font-size: 13px; color: #64748b; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- Huvudställning -->
  <div class="header-card">
    <div class="match-teams" id="main-teams">Laddar lag...</div>
    <div class="main-score" id="main-score">0 - 0</div>
  </div>

  <!-- Välj delmatch -->
  <div class="section-title">Välj delmatch att döma:</div>
  <div class="submatches-grid" id="submatches-list">
    <!-- Fylls i dynamiskt -->
  </div>

  <!-- Inmatningspanel för vald delmatch -->
  <div class="referee-box" id="referee-box">
    <div class="active-sm-header" id="active-sm-title">Delmatch</div>

    <div class="leg-scores">
      <div class="p-box">
        <div class="p-name" id="home-player-name">Spelare Hemma</div>
        <div class="p-legs" id="home-player-legs">0</div>
      </div>
      <div style="font-size:20px; font-weight:bold; color:#64748b;">VS</div>
      <div class="p-box">
        <div class="p-name" id="away-player-name">Spelare Borta</div>
        <div class="p-legs" id="away-player-legs">0</div>
      </div>
    </div>

    <div class="input-display" id="input-display">0</div>

    <div class="numpad">
      <button class="num-btn" onclick="pressNum('1')">1</button>
      <button class="num-btn" onclick="pressNum('2')">2</button>
      <button class="num-btn" onclick="pressNum('3')">3</button>
      <button class="num-btn" onclick="pressNum('4')">4</button>
      <button class="num-btn" onclick="pressNum('5')">5</button>
      <button class="num-btn" onclick="pressNum('6')">6</button>
      <button class="num-btn" onclick="pressNum('7')">7</button>
      <button class="num-btn" onclick="pressNum('8')">8</button>
      <button class="num-btn" onclick="pressNum('9')">9</button>
      <button class="num-btn btn-clear" onclick="clearNum()">C</button>
      <button class="num-btn" onclick="pressNum('0')">0</button>
      <button class="num-btn btn-ok" onclick="submitScore()">OK</button>
    </div>

    <div class="leg-win-btns">
      <button class="btn-win" onclick="registerLegWin('home')">Leg Vinst Hemma</button>
      <button class="btn-win" onclick="registerLegWin('away')">Leg Vinst Borta</button>
    </div>
  </div>

  <div class="status-text" id="status-bar">Status: Initierar...</div>

  <script>
    var SUPABASE_URL = 'https://luznainkmcogcqbuprzw.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_6psZleJBdhdZFhUTutZqnw_Rr4Y2SI6';

    var fullMatchData = null;
    var activeSubIndex = null;
    var currentInput = '';

    function apiCall(method, endpoint, body, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, SUPABASE_URL + endpoint, true);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
      xhr.setRequestHeader('Content-Type', 'application/json');

      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status >= 200 && xhr.status < 300) {
            var data = xhr.responseText ? JSON.parse(xhr.responseText) : null;
            callback(null, data);
          } else {
            callback('HTTP Error ' + xhr.status, null);
          }
        }
      };
      xhr.send(body ? JSON.stringify(body) : null);
    }

    function loadMatchData() {
      apiCall('GET', '/rest/v1/matches?id=eq.main_match', null, function(err, res) {
        if (!err && res && res.length > 0) {
          fullMatchData = res[0].data;
          renderUI();
          document.getElementById('status-bar').innerText = 'Data synkad ' + new Date().toLocaleTimeString();
        } else {
          document.getElementById('status-bar').innerText = 'Kunde inte hämta matchdata.';
        }
      });
    }

    function renderUI() {
      if (!fullMatchData) return;

      // 1. Rendera Lag och Huvudställning
      document.getElementById('main-teams').innerText = fullMatchData.homeTeam + ' vs ' + fullMatchData.awayTeam;
      
      var homeWins = 0;
      var awayWins = 0;
      var subMatches = fullMatchData.subMatches || [];

      for (var i = 0; i < subMatches.length; i++) {
        if (subMatches[i].homeScore === 3) homeWins++;
        if (subMatches[i].awayScore === 3) awayWins++;
      }
      document.getElementById('main-score').innerText = homeWins + ' - ' + awayWins;

      // 2. Rendera listan över delmatcher
      var grid = document.getElementById('submatches-list');
      grid.innerHTML = '';

      for (var j = 0; j < subMatches.length; j++) {
        var sm = subMatches[j];
        var isFinished = sm.homeScore === 3 || sm.awayScore === 3;
        var isActive = activeSubIndex === j;

        var btn = document.createElement('button');
        btn.className = 'submatch-btn' + (isActive ? ' active' : '') + (isFinished ? ' finished' : '');
        btn.setAttribute('onclick', 'selectSubMatch(' + j + ')');

        btn.innerHTML = 
          '<span class="sm-score">' + (sm.homeScore || 0) + ' - ' + (sm.awayScore || 0) + '</span>' +
          '<div class="sm-title">Delmatch ' + (j + 1) + '</div>' +
          '<div class="sm-players">' + (sm.homePlayer || 'Spelare H') + ' / ' + (sm.awayPlayer || 'Spelare B') + '</div>';

        grid.appendChild(btn);
      }

      // 3. Om en delmatch är vald, uppdatera domarboxen
      if (activeSubIndex !== null && subMatches[activeSubIndex]) {
        var activeSub = subMatches[activeSubIndex];
        document.getElementById('referee-box').style.display = 'block';
        document.getElementById('active-sm-title').innerText = 'Dömer Delmatch ' + (activeSubIndex + 1);
        document.getElementById('home-player-name').innerText = activeSub.homePlayer || fullMatchData.homeTeam;
        document.getElementById('away-player-name').innerText = activeSub.awayPlayer || fullMatchData.awayTeam;
        document.getElementById('home-player-legs').innerText = activeSub.homeScore || 0;
        document.getElementById('away-player-legs').innerText = activeSub.awayScore || 0;
      }
    }

    function selectSubMatch(index) {
      activeSubIndex = index;
      renderUI();
    }

    function pressNum(n) {
      if (currentInput.length < 3) {
        currentInput += n;
        document.getElementById('input-display').innerText = currentInput;
      }
    }

    function clearNum() {
      currentInput = '';
      document.getElementById('input-display').innerText = '0';
    }

    function saveToDatabase() {
      document.getElementById('status-bar').innerText = 'Sparar till TV/Publikvy...';
      apiCall('PATCH', '/rest/v1/matches?id=eq.main_match', { data: fullMatchData }, function(err) {
        if (!err) {
          document.getElementById('status-bar').innerText = 'Sparat & Uppdaterat!';
          renderUI();
        } else {
          document.getElementById('status-bar').innerText = 'Fel vid sparning.';
        }
      });
    }

    function submitScore() {
      if (activeSubIndex === null || !currentInput) return;
      var val = parseInt(currentInput, 10);
      
      var sm = fullMatchData.subMatches[activeSubIndex];
      if (!sm.scores) sm.scores = [];
      sm.scores.push(val);

      clearNum();
      saveToDatabase();
    }

    function registerLegWin(team) {
      if (activeSubIndex === null) return;
      var sm = fullMatchData.subMatches[activeSubIndex];

      if (team === 'home') sm.homeScore = (sm.homeScore || 0) + 1;
      if (team === 'away') sm.awayScore = (sm.awayScore || 0) + 1;

      saveToDatabase();
    }

    // Starta
    loadMatchData();
  </script>
</body>
</html>
