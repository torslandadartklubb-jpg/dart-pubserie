<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dart Domarpanel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    :root {
      --bg-main: #020617;
      --bg-card: #0f172a;
      --bg-item: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --input-bg: #090d16;
      --accent-home: #38bdf8;
      --accent-away: #f43f5e;
      --border-home: #0284c7;
      --border-away: #e11d48;
      --text-score: #f59e0b;
    }
    body.light-theme {
      --bg-main: #e2e8f0;
      --bg-card: #ffffff;
      --bg-item: #f1f5f9;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #334155;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --accent-home: #1d4ed8;
      --accent-away: #be123c;
      --border-home: #2563eb;
      --border-away: #e11d48;
      --text-score: #d97706;
      background-color: #e2e8f0 !important;
      color: #0f172a !important;
    }
    body.light-theme .card,
    body.light-theme .recent-box,
    body.light-theme .input-box,
    body.light-theme .modal-box {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
    }
    body.light-theme .recent-row {
      border-bottom-color: #cbd5e1 !important;
      color: #0f172a !important;
    }
    html, body { width: 100%; height: 100%; background-color: var(--bg-main); color: var(--text-main); padding: 6px; overflow: hidden; }
    
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 10px; text-align: center; margin-bottom: 8px; position: relative; }
    .teams-title { font-size: 18px; font-weight: bold; color: var(--text-sub); }
    .main-score { font-size: 36px; font-weight: 900; color: var(--text-score); margin: 2px 0; }
    
    .section-title { font-size: 16px; font-weight: bold; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .match-list { display: block; width: 100%; }
    .match-item { background: var(--bg-item); border: 2px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; display: -webkit-flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: left; width: 100%; color: var(--text-main); margin-bottom: 8px; }
    .match-item:active { background: var(--border-color); }
    
    .match-item.finished { border-color: #059669; background-color: #061f17; opacity: 0.6; cursor: not-allowed; }
    .match-item.ongoing { border-color: #0284c7; background-color: var(--bg-card); }
    
    .match-info-tag { font-size: 13px; font-weight: bold; color: #0284c7; }
    .match-players { font-size: 17px; font-weight: bold; margin-top: 2px; }
    .match-status { font-size: 14px; font-weight: bold; padding: 6px 12px; border-radius: 8px; background: #2563eb; color: #fff; }
    .match-status.done { background: #059669; color: #a7f3d0; }
    .match-status.ongoing { background: #0284c7; }
    
    #judge-view { display: none; width: 100%; background-color: var(--bg-main); color: var(--text-main); padding: 2px; border-radius: 16px; -webkit-user-select: none; user-select: none; }
    .status-text { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 4px; word-break: break-all; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.85); display: flex; display: -webkit-flex; align-items: center; justify-content: center; z-index: 100; padding: 12px; }
    .modal-box { background-color: var(--bg-card); border-radius: 16px; padding: 20px; text-align: center; max-width: 500px; width: 100%; color: var(--text-main); border: 2px solid var(--border-color); }
    
    /* 3 SENASTE KAST */
    .recent-throws-container { display: flex; display: -webkit-flex; margin-bottom: 8px; align-items: stretch; }
    .recent-box { width: 42.5%; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 2px; text-align: center; height: 160px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-around; }
    
    .dart-col-box { width: 15%; display: flex; display: -webkit-flex; flex-direction: column; justify-content: space-around; align-items: center; height: 160px; overflow: hidden; }
    .dart-col-row { font-size: 20px; font-weight: 800; color: #0284c7; height: 50px; display: flex; align-items: center; justify-content: center; }
    .recent-row { font-size: 46px; font-weight: 900; border-bottom: 1px solid var(--border-color); height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); line-height: 1; }
    .recent-row:last-child { border-bottom: none; }
    .recent-rem { font-size: 20px; color: #0284c7; font-weight: bold; margin-left: 6px; }
    /* HÖRN-BOXAR FÖR LEGS OCH PILAR */
    .corner-square {
      position: absolute;
      bottom: 6px;
      width: 44px;
      height: 38px;
      background: var(--bg-item);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .corner-square.legs { color: var(--text-score); border-color: #d97706; }
    .corner-square.darts { color: #38bdf8; border-color: #0284c7; }
    /* TABELL LAYOUT FÖR NUMPAD */
    .numpad-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 6px;
      margin-top: -4px;
    }
    .numpad-table td {
      width: 25%;
      height: 82px;
      padding: 0;
      vertical-align: middle;
    }
    .numpad-btn-legacy {
      width: 100%;
      height: 100%;
      background-color: var(--bg-item);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      font-size: 38px;
      font-weight: bold;
      cursor: pointer;
      display: block;
      text-align: center;
      line-height: 82px;
      -webkit-appearance: none;
    }
    .numpad-btn-legacy:active { background-color: var(--border-color); }
  </style>
</head>
<body>
  <div class="card" id="top-match-card">
    <div class="teams-title" id="main-teams">Laddar lag...</div>
    <div class="main-score" id="main-score">0 - 0</div>
  </div>
  <div id="start-view">
    <div class="section-title">Välj delmatch att döma:</div>
    <div class="match-list" id="match-list-container"></div>
  </div>
  <div id="judge-view"></div>
  <div class="status-text" id="status-bar">Status: Synkar...</div>
  <!-- FULLSKÄRMS-POPUP FÖR SCORING -->
  <div id="scoring-modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-box" style="border: 3px solid #d97706; background-color: var(--bg-card); max-width: 520px;">
      
      <!-- ÖVERSTA TITELBANDEROLEN -->
      <div style="color: #f59e0b; font-weight: 900; font-size: 16px; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase;">
        🔥 SCORING (39 PILAR NÅDDA)
      </div>
      <!-- TUR-SKYLTA -->
      <div id="sc-turn-card" style="padding: 10px; border-radius: 12px; margin-bottom: 10px; border: 2px solid var(--border-color); background-color: var(--bg-item);">
        <div style="font-size: 12px; color: var(--text-muted); font-weight: bold; text-transform: uppercase;">Aktiv kastaress:</div>
        <div id="sc-turn-name" style="font-size: 22px; font-weight: 900; color: #38bdf8; margin-top: 2px;">-</div>
      </div>
      <!-- TILLFÄLLIG HISTORIK I SCORINGEN -->
      <div id="sc-history-summary" style="display: flex; justify-content: space-around; background: var(--bg-item); padding: 6px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; color: var(--text-sub);">
        <!-- Fylls dynamiskt -->
      </div>
      <!-- SCORING NUMPAD -->
      <table class="numpad-table">
        <tr>
          <td><button onclick="handleNumClick('1')" class="numpad-btn-legacy">1</button></td>
          <td><button onclick="handleNumClick('2')" class="numpad-btn-legacy">2</button></td>
          <td><button onclick="handleNumClick('3')" class="numpad-btn-legacy">3</button></td>
          <td rowspan="2" style="background-color: var(--input-bg); border: 2px solid #f59e0b; border-radius: 14px; text-align: center; vertical-align: middle;">
            <div style="font-size: 11px; color: var(--text-muted); font-weight: bold; letter-spacing: 1px;">INMATAT</div>
            <div id="sc-input-display" style="font-size: 52px; font-weight: 900; color: #f59e0b; line-height: 1; margin-top: 2px;">0</div>
          </td>
        </tr>
        <tr>
          <td><button onclick="handleNumClick('4')" class="numpad-btn-legacy">4</button></td>
          <td><button onclick="handleNumClick('5')" class="numpad-btn-legacy">5</button></td>
          <td><button onclick="handleNumClick('6')" class="numpad-btn-legacy">6</button></td>
        </tr>
        <tr>
          <td><button onclick="handleNumClick('7')" class="numpad-btn-legacy">7</button></td>
          <td><button onclick="handleNumClick('8')" class="numpad-btn-legacy">8</button></td>
          <td><button onclick="handleNumClick('9')" class="numpad-btn-legacy">9</button></td>
          <td><button onclick="handleScoringStepSubmit()" class="numpad-btn-legacy" style="background-color: #16a34a; color: #fff; border: none; font-size: 22px;">OK</button></td>
        </tr>
        <tr>
          <td><button onclick="handleNumClick('0')" class="numpad-btn-legacy">0</button></td>
          <td><button onclick="handleClear()" class="numpad-btn-legacy" style="background-color: #dc2626; color: #ffffff; border: none; font-size: 28px;">C</button></td>
          <td><button onclick="handleScoringStepSubmit()" class="numpad-btn-legacy" style="background-color: #16a34a; color: #fff; border: none; font-size: 22px;">OK</button></td>
          <td><button onclick="handleUndoScoringStep()" class="numpad-btn-legacy" style="font-size: 18px;">Ångra</button></td>
        </tr>
      </table>
    </div>
  </div>
  <script>
    var SUPABASE_URL = 'https://luznainkmcogcqbuprzw.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_6psZleJBdhdZFhUTutZqnw_Rr4Y2SI6';
    var IMPOSSIBLE_SCORES = [163, 166, 169, 172, 173, 175, 176, 178, 179];
    var IMPOSSIBLE_CHECKOUTS = [159, 162, 163, 165, 166, 168, 169];
    var HOME_STARTS_MATCHES = ['S1', 'S3', 'S5', 'S7', 'D1', 'D3', 'AD'];
    var fullMatchData = null;
    var activeSubIndex = null;
    var activeMatch = null;
    var isLightTheme = false;
    var pollingTimer = null;

    if (window.localStorage && localStorage.getItem('dart_theme') === 'light') {
      isLightTheme = true;
      document.body.className = 'light-theme';
    }

    function toggleTheme() {
      isLightTheme = !isLightTheme;
      document.body.className = isLightTheme ? 'light-theme' : '';
      if (window.localStorage) {
        localStorage.setItem('dart_theme', isLightTheme ? 'light' : 'dark');
      }
      renderJudgeUI();
    }

    function apiCall(method, endpoint, body, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, SUPABASE_URL + endpoint, true);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
      xhr.setRequestHeader('Content-Type', 'application/json');
      if (method === 'POST') {
        xhr.setRequestHeader('Prefer', 'resolution=merge-duplicates');
      }
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status >= 200 && xhr.status < 300) {
            var data = xhr.responseText ? JSON.parse(xhr.responseText) : null;
            callback(null, data);
          } else {
            callback('HTTP Fel ' + xhr.status, null);
          }
        }
      };
      xhr.onerror = function() { callback('Nätverksfel vid anrop', null); };
      xhr.send(body ? JSON.stringify(body) : null);
    }

    function loadMatchData(cb) {
      document.getElementById('status-bar').innerText = 'Hämtar data...';
      apiCall('GET', '/rest/v1/matches?id=eq.main_match', null, function(err, res) {
        if (!err && res && res.length > 0) {
          fullMatchData = res[0].data;
          if (!fullMatchData.performances) fullMatchData.performances = [];
          if (activeSubIndex === null) {
            renderStartUI();
          }
          document.getElementById('status-bar').innerText = 'Synkad: ' + new Date().toLocaleTimeString();
          if (cb) cb(null, fullMatchData);
        } else {
          document.getElementById('status-bar').innerText = 'Fel vid hämtning: ' + (err || 'Ingen data hittades');
          if (activeSubIndex === null) document.getElementById('main-teams').innerText = 'Kunde inte ladda lag';
          if (cb) cb(err, null);
        }
      });
    }

    // Polla matchen var 3:e sekund när man är i startmenyn
    function startPolling() {
      stopPolling();
      pollingTimer = setInterval(function() {
        if (activeSubIndex === null) {
          loadMatchData();
        }
      }, 3000);
    }

    function stopPolling() {
      if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
      }
    }

    function renderStartUI() {
      if (!fullMatchData) return;
      document.getElementById('main-teams').innerText = (fullMatchData.homeTeam || 'Hemmalag') + ' vs ' + (fullMatchData.awayTeam || 'Bortalag');
      
      var homeWins = 0;
      var awayWins = 0;
      var subMatches = fullMatchData.subMatches || [];
      for (var i = 0; i < subMatches.length; i++) {
        if (subMatches[i].homeScore === 3) homeWins++;
        if (subMatches[i].awayScore === 3) awayWins++;
      }
      document.getElementById('main-score').innerText = homeWins + ' - ' + awayWins;
      var listContainer = document.getElementById('match-list-container');
      listContainer.innerHTML = '';
      for (var j = 0; j < subMatches.length; j++) {
        var sm = subMatches[j];
        var isFinished = (sm.homeScore >= 3 || sm.awayScore >= 3 || sm.status === 'completed' || sm.status === 'finished');
        var isOngoing = !isFinished && (sm.status === 'ongoing' || sm.status === 'live');
        var btn = document.createElement('button');
        btn.className = 'match-item' + (isFinished ? ' finished' : (isOngoing ? ' ongoing' : ''));
        
        if (isFinished) {
          btn.onclick = function(e) {
            e.preventDefault();
            alert('Denna match är färdigspelad och kan inte väljas.');
          };
        } else {
          btn.onclick = (function(idx) { return function() { selectSubMatch(idx); }; })(j);
        }
        var infoDiv = document.createElement('div');
        infoDiv.innerHTML = '<div class="match-info-tag">Delmatch ' + (idxMatch(j)) + '</div>' +
                            '<div class="match-players">' + (sm.homePlayer || 'Hemma') + ' vs ' + (sm.awayPlayer || 'Borta') + '</div>';
        var statusText = (sm.homeScore || 0) + ' - ' + (sm.awayScore || 0);
        if (isFinished) statusText += ' (KLAR - EJ VALBAR)';
        else if (isOngoing) statusText += ' (PÅGÅENDE)';
        var statusDiv = document.createElement('div');
        statusDiv.className = 'match-status' + (isFinished ? ' done' : (isOngoing ? ' ongoing' : ''));
        statusDiv.innerText = statusText;
        btn.appendChild(infoDiv);
        btn.appendChild(statusDiv);
        listContainer.appendChild(btn);
      }
    }

    function idxMatch(j) {
      if (j < 8) return 'S' + (j + 1);
      if (j < 11) return 'D' + (j - 7);
      return 'AD';
    }

    function selectSubMatch(index) {
      stopPolling();
      activeSubIndex = index;
      var sm = fullMatchData.subMatches[index] || {};
      var matchId = idxMatch(index);
      var initialStarter = null;
      if (matchId !== 'AD') {
        initialStarter = HOME_STARTS_MATCHES.indexOf(matchId) !== -1 ? 'home' : 'away';
      }
      var restoredRounds = sm.rounds ? JSON.parse(JSON.stringify(sm.rounds)) : [];
      var restoredHistory = sm.historyStack ? JSON.parse(JSON.stringify(sm.historyStack)) : [];
      var restoredLegStarter = sm.legStarter || initialStarter;
      var restoredTurn = sm.turn || restoredLegStarter;
      
      var hPts = (sm.currentHomePoints !== undefined && sm.currentHomePoints !== null) ? sm.currentHomePoints : 501;
      var aPts = (sm.currentAwayPoints !== undefined && sm.currentAwayPoints !== null) ? sm.currentAwayPoints : 501;
      var isDouble = index >= 8;
      activeMatch = {
        id: matchId,
        type: isDouble ? 'double' : 'single',
        homePlayer: sm.homePlayer || fullMatchData.homeTeam,
        awayPlayer: sm.awayPlayer || fullMatchData.awayTeam,
        homeScore: hPts,
        awayScore: aPts,
        homeLegs: sm.homeScore || 0,
        awayLegs: sm.awayScore || 0,
        legStarter: restoredLegStarter,
        turn: restoredTurn,
        inputVal: '',
        historyStack: restoredHistory,
        rounds: restoredRounds,
        performances: [],
        scoringActive: sm.scoringActive || false,
        scoringState: null
      };
      if (sm.homeScore < 3 && sm.awayScore < 3) sm.status = 'live';
      document.getElementById('start-view').style.display = 'none';
      document.getElementById('judge-view').style.display = 'block';
      
      if (activeMatch.scoringActive) {
        initScoringState();
      }
      renderJudgeUI();
      triggerLiveUpdate();
    }

    function showStartView() {
      activeSubIndex = null;
      activeMatch = null;
      document.getElementById('judge-view').style.display = 'none';
      document.getElementById('scoring-modal-overlay').style.display = 'none';
      document.getElementById('start-view').style.display = 'block';
      loadMatchData();
      startPolling();
    }

    function countPlayerDarts(rounds, team) {
      var count = 0;
      for (var i = 0; i < rounds.length; i++) {
        if (team === 'home' && rounds[i].home) count += 3;
        if (team === 'away' && rounds[i].away) count += 3;
      }
      return count;
    }

    function getDisplayPlayerName(teamKey, playerRaw) {
      var teamName = teamKey === 'home' ? (fullMatchData ? fullMatchData.homeTeam : 'Hemmalag') : (fullMatchData ? fullMatchData.awayTeam : 'Bortalag');
      if (playerRaw && playerRaw !== teamName) {
        return teamName + ' - ' + playerRaw;
      }
      return teamName;
    }

    function initScoringState() {
      var m = activeMatch;
      var starter = m.legStarter || 'home';
      var second = starter === 'home' ? 'away' : 'home';
      
      if (m.type === 'single') {
        var p1Name = getDisplayPlayerName(starter, starter === 'home' ? m.homePlayer : m.awayPlayer);
        var p2Name = getDisplayPlayerName(second, second === 'home' ? m.homePlayer : m.awayPlayer);
        
        m.scoringState = {
          step: 0,
          queue: [
            { team: starter, label: p1Name, score: null },
            { team: second, label: p2Name, score: null }
          ]
        };
      } else {
        var homeTeamName = fullMatchData ? fullMatchData.homeTeam : 'Hemmalag';
        var awayTeamName = fullMatchData ? fullMatchData.awayTeam : 'Bortalag';
        
        var hPlayers = (m.homePlayer || '').split('&').map(function(s){ return s.trim(); });
        var aPlayers = (m.awayPlayer || '').split('&').map(function(s){ return s.trim(); });
        
        var hP1 = homeTeamName + (hPlayers[0] ? ' - ' + hPlayers[0] : '');
        var hP2 = homeTeamName + (hPlayers[1] ? ' - ' + hPlayers[1] : (hPlayers[0] ? ' - ' + hPlayers[0] : ''));
        var aP1 = awayTeamName + (aPlayers[0] ? ' - ' + aPlayers[0] : '');
        var aP2 = awayTeamName + (aPlayers[1] ? ' - ' + aPlayers[1] : (aPlayers[0] ? ' - ' + aPlayers[0] : ''));
        if (starter === 'home') {
          m.scoringState = {
            step: 0,
            queue: [
              { team: 'home', label: hP1, score: null },
              { team: 'away', label: aP1, score: null },
              { team: 'home', label: hP2, score: null },
              { team: 'away', label: aP2, score: null }
            ]
          };
        } else {
          m.scoringState = {
            step: 0,
            queue: [
              { team: 'away', label: aP1, score: null },
              { team: 'home', label: hP1, score: null },
              { team: 'away', label: aP2, score: null },
              { team: 'home', label: hP2, score: null }
            ]
          };
        }
      }
    }

    function renderJudgeUI() {
      var container = document.getElementById('judge-view');
      if (!activeMatch) { container.innerHTML = ''; return; }
      var m = activeMatch;
      var isFinished = m.homeLegs === 3 || m.awayLegs === 3;
      
      if (!m.turn && m.id === 'AD') {
        var hDisplayName = getDisplayPlayerName('home', m.homePlayer);
        var aDisplayName = getDisplayPlayerName('away', m.awayPlayer);
        container.innerHTML = 
          '<div class="card" style="padding: 24px; border: 2px solid #eab308;">' +
            '<h2 style="color: #eab308; font-size: 24px; margin-bottom: 10px;">AVGÖRANDE DUBBEL (AD)</h2>' +
            '<p style="color: var(--text-sub); font-size: 16px; margin-bottom: 20px;">Vem vann slantkastningen och börjar?</p>' +
            '<div style="display: flex; display: -webkit-flex;">' +
              '<button onclick="setADStarter(\'home\')" style="width: 48%; margin-right: 4%; background-color: var(--bg-item); color: var(--accent-home); border: 2px solid var(--border-home); padding: 20px; border-radius: 12px; font-weight: bold; font-size: 20px; cursor: pointer;">' + hDisplayName + '</button>' +
              '<button onclick="setADStarter(\'away\')" style="width: 48%; background-color: var(--bg-item); color: var(--accent-away); border: 2px solid var(--border-away); padding: 20px; border-radius: 12px; font-weight: bold; font-size: 20px; cursor: pointer;">' + aDisplayName + '</button>' +
            '</div>' +
          '</div>';
        return;
      }
      var currentInskriven = m.inputVal || '0';
      var homeDarts = countPlayerDarts(m.rounds, 'home');
      var awayDarts = countPlayerDarts(m.rounds, 'away');
      var homeDisplayName = getDisplayPlayerName('home', m.homePlayer);
      var awayDisplayName = getDisplayPlayerName('away', m.awayPlayer);
      var html = '';
      // Header
      html += '<div style="display: flex; display: -webkit-flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">' +
                '<div style="display: flex; display: -webkit-flex; gap: 6px; flex: 1;">' +
                  '<button onclick="showStartView()" style="background-color: var(--bg-item); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold;">← Meny</button>' +

                  '<div style="font-size: 150px; font-size: min(150px, 16vw); font-weight: 900; color: ' + (m.turn === 'home' ? 'var(--accent-home)' : 'var(--text-muted)') + '; line-height: 0.8; letter-spacing: -4px; margin: 2px 0;">' + m.homeScore + '</div>' +
                  '<div class="corner-square darts" style="left: 6px;">' + homeDarts + '</div>' +
                  '<div class="corner-square legs" style="right: 6px;">' + m.homeLegs + '</div>' +
                '</div>' +
                '<div class="card" style="width: 49%; padding: 6px 2px 34px 2px; border-radius: 16px; border: ' + (m.turn === 'away' ? '4px solid var(--border-away)' : '1px solid var(--border-color)') + ';">' +
                  '<div style="font-size: 18px; font-weight: bold; color: var(--text-sub); margin-bottom: 0px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + awayDisplayName + '</div>' +
                  '<div style="font-size: 150px; font-size: min(150px, 16vw); font-weight: 900; color: ' + (m.turn === 'away' ? 'var(--accent-away)' : 'var(--text-muted)') + '; line-height: 0.8; letter-spacing: -4px; margin: 2px 0;">' + m.awayScore + '</div>' +
                  '<div class="corner-square legs" style="left: 6px;">' + m.awayLegs + '</div>' +
                  '<div class="corner-square darts" style="right: 6px;">' + awayDarts + '</div>' +
                '</div>' +
              '</div>';
      // 2. EXAKT 3 SENASTE KAST
      var roundsList = m.rounds.slice().reverse().slice(0, 3);
      var hasHomeThrows = m.rounds.some(function(r) { return r.home; });
      var hasAwayThrows = m.rounds.some(function(r) { return r.away; });
      html += '<div class="recent-throws-container">' +
                '<div class="recent-box home">';
      if (!hasHomeThrows) {
        html += '<div style="color: var(--text-muted); font-size: 16px; display: flex; align-items: center; justify-content: center; height: 100%;">Inga kast än</div>';
      } else {
        for (var i = 0; i < roundsList.length; i++) {
          var r1 = roundsList[i];
          if (r1.home) {
            var origIdx1 = m.rounds.indexOf(r1);
            html += '<div class="recent-row" onclick="handleEditRound(' + origIdx1 + ', \'home\')">' + formatThrowLarge(r1.home) + '</div>';
          } else {
            html += '<div class="recent-row" style="color: var(--text-muted);">-</div>';
          }
        }
      }
      html +=   '</div>';
      html +=   '<div class="dart-col-box">';
      if (m.rounds.length === 0) {
        html += '<div class="dart-col-row" style="color: var(--text-muted);">-</div>';
      } else {
        for (var d = 0; d < roundsList.length; d++) {
          var roundNum = m.rounds.length - d;
          html += '<div class="dart-col-row">' + (roundNum * 3) + '</div>';
        }
      }
      html +=   '</div>';
      html +=   '<div class="recent-box">';
      if (!hasAwayThrows) {
        html += '<div style="color: var(--text-muted); font-size: 16px; display: flex; align-items: center; justify-content: center; height: 100%;">Inga kast än</div>';
      } else {
        for (var j = 0; j < roundsList.length; j++) {
          var r2 = roundsList[j];
          if (r2.away) {
            var origIdx2 = m.rounds.indexOf(r2);
            html += '<div class="recent-row" onclick="handleEditRound(' + origIdx2 + ', \'away\')">' + formatThrowLarge(r2.away) + '</div>';
          } else {
            html += '<div class="recent-row" style="color: var(--text-muted);">-</div>';
          }
        }
      }
      html +=   '</div>' +
              '</div>';
      // 3. VANLIG NUMPAD
      if (!isFinished && !m.scoringActive) {
        document.getElementById('scoring-modal-overlay').style.display = 'none';
        html += '<table class="numpad-table">' +
                  '<tr>' +
                    '<td><button onclick="handleNumClick(\'1\')" class="numpad-btn-legacy">1</button></td>' +
                    '<td><button onclick="handleNumClick(\'2\')" class="numpad-btn-legacy">2</button></td>' +
                    '<td><button onclick="handleNumClick(\'3\')" class="numpad-btn-legacy">3</button></td>' +
                    '<td rowspan="2" style="background-color: var(--input-bg); border: 2px solid #0284c7; border-radius: 14px; text-align: center; vertical-align: middle;">' +
                      '<div style="font-size: 12px; color: var(--text-muted); font-weight: bold; letter-spacing: 1px;">INMATAT</div>' +
                      '<div style="font-size: 52px; font-weight: 900; color: #f59e0b; line-height: 1; margin-top: 2px;">' + currentInskriven + '</div>' +
                    '</td>' +
                  '</tr>' +
                  '<tr>' +
                    '<td><button onclick="handleNumClick(\'4\')" class="numpad-btn-legacy">4</button></td>' +
                    '<td><button onclick="handleNumClick(\'5\')" class="numpad-btn-legacy">5</button></td>' +
                    '<td><button onclick="handleNumClick(\'6\')" class="numpad-btn-legacy">6</button></td>' +
                  '</tr>' +
                  '<tr>' +
                    '<td><button onclick="handleNumClick(\'7\')" class="numpad-btn-legacy">7</button></td>' +
                    '<td><button onclick="handleNumClick(\'8\')" class="numpad-btn-legacy">8</button></td>' +
                    '<td><button onclick="handleNumClick(\'9\')" class="numpad-btn-legacy">9</button></td>' +
                    '<td><button onclick="handleOpenRemainingModal()" class="numpad-btn-legacy" style="background-color: #0284c7; color: #fff; border: none; font-size: 20px;">Sätt kvar</button></td>' +
                  '</tr>' +
                  '<tr>' +
                    '<td><button onclick="handleNumClick(\'0\')" class="numpad-btn-legacy">0</button></td>' +
                    '<td><button onclick="handleClear()" class="numpad-btn-legacy" style="background-color: #dc2626; color: #ffffff; border: none; font-size: 28px;">C</button></td>' +
                    '<td><button onclick="handleEnterScore()" class="numpad-btn-legacy" style="background-color: #16a34a; color: #fff; border: none; font-size: 28px;">OK</button></td>' +
                    '<td><button onclick="handleUndo()" class="numpad-btn-legacy" style="font-size: 20px;">Ångra</button></td>' +
                  '</tr>' +
                '</table>';
      } else if (m.scoringActive) {
        renderScoringModal();
      }
      container.innerHTML = html;
    }

    function renderScoringModal() {
      var m = activeMatch;
      if (!m || !m.scoringState) return;
      var modal = document.getElementById('scoring-modal-overlay');
      modal.style.display = 'flex';
      var state = m.scoringState;
      var curStepObj = state.queue[state.step];
      var turnNameEl = document.getElementById('sc-turn-name');
      var turnCardEl = document.getElementById('sc-turn-card');
      turnNameEl.innerText = curStepObj.label;
      
      if (curStepObj.team === 'home') {
        turnNameEl.style.color = 'var(--accent-home)';
        turnCardEl.style.borderColor = 'var(--border-home)';
      } else {
        turnNameEl.style.color = 'var(--accent-away)';
        turnCardEl.style.borderColor = 'var(--border-away)';
      }
      document.getElementById('sc-input-display').innerText = m.inputVal || '0';
      var summaryEl = document.getElementById('sc-history-summary');
      var summaryHtml = '';
      for (var i = 0; i < state.queue.length; i++) {
        var item = state.queue[i];
        var isCurrent = i === state.step;
        var scoreTxt = item.score !== null ? item.score + ' p' : (isCurrent ? '👉 KASTAR' : '-');
        var color = item.team === 'home' ? 'var(--accent-home)' : 'var(--accent-away)';
        
        summaryHtml += '<div style="text-align: center;' + (isCurrent ? ' font-weight: bold; font-size: 14px;' : ' opacity: 0.8;') + '">' +
                          '<div style="font-size: 11px; color: ' + color + ';">' + item.label + '</div>' +
                          '<div style="color: var(--text-score); font-weight: 900;">' + scoreTxt + '</div>' +
                       '</div>';
      }
      summaryEl.innerHTML = summaryHtml;
    }

    function formatThrowLarge(entry) {
      if (!entry) return '<span style="color: var(--text-muted);">-</span>';
      if (entry.score === 'BUST') {
        return '<span style="color: #dc2626;">BUST</span><span class="recent-rem">(' + entry.remaining + ')</span>';
      }
      return '<span style="color: var(--text-score);">' + entry.score + '</span><span class="recent-rem">(' + entry.remaining + ')</span>';
    }

    function setADStarter(team) {
      activeMatch.legStarter = team;
      activeMatch.turn = team;
      renderJudgeUI();
      triggerLiveUpdate();
    }

    function handleNumClick(num) {
      if (!activeMatch || activeMatch.inputVal.length >= 3) return;
      activeMatch.inputVal += num;
      if (activeMatch.scoringActive) {
        renderScoringModal();
      } else {
        renderJudgeUI();
      }
    }

    function handleClear() {
      if (!activeMatch) return;
      activeMatch.inputVal = '';
      if (activeMatch.scoringActive) {
        renderScoringModal();
      } else {
        renderJudgeUI();
      }
    }

    function saveStateToHistory() {
      var m = activeMatch;
      m.historyStack.push({
        homeScore: m.homeScore,
        awayScore: m.awayScore,
        homeLegs: m.homeLegs,
        awayLegs: m.awayLegs,
        turn: m.turn,
        legStarter: m.legStarter,
        rounds: JSON.parse(JSON.stringify(m.rounds)),
        performances: JSON.parse(JSON.stringify(m.performances))
      });
    }

    function handleUndo() {
      var m = activeMatch;
      if (!m || m.historyStack.length === 0) return;
      var last = m.historyStack.pop();
      m.homeScore = last.homeScore;
      m.awayScore = last.awayScore;
      m.homeLegs = last.homeLegs;
      m.awayLegs = last.awayLegs;
      m.turn = last.turn;
      m.legStarter = last.legStarter;
      m.rounds = last.rounds;
      m.performances = last.performances;
      m.inputVal = '';
      m.scoringActive = false;
      m.scoringState = null;
      renderJudgeUI();
      triggerLiveUpdate();
    }

    function handleEnterScore() {
      var m = activeMatch;
      if (!m || !m.turn) return;
      var score = parseInt(m.inputVal || '0', 10);
      if (isNaN(score) || score > 180) {
        alert('Ange en giltig poäng mellan 0 och 180.');
        return;
      }
      if (IMPOSSIBLE_SCORES.indexOf(score) !== -1) {
        alert('Det går inte att få ' + score + ' poäng på 3 pilar!');
        m.inputVal = '';
        renderJudgeUI();
        return;
      }
      var currentScore = m.turn === 'home' ? m.homeScore : m.awayScore;
      var remaining = currentScore - score;
      if (remaining === 0) {
        if (IMPOSSIBLE_CHECKOUTS.indexOf(score) !== -1 || score > 170) {
          processScore(score, false);
          return;
        }
        showCheckoutModal(score);
        return;
      }
      processScore(score, false);
    }

    function handleOpenRemainingModal() {
      var m = activeMatch;
      if (!m || !m.inputVal) return;
      var targetRemaining = parseInt(m.inputVal, 10);
      var currentScore = m.turn === 'home' ? m.homeScore : m.awayScore;
      if (isNaN(targetRemaining) || targetRemaining < 0 || targetRemaining >= currentScore) {
        alert('Återstående poäng måste vara mindre än nuvarande poäng (' + currentScore + ').');
        return;
      }
      var calculatedScored = currentScore - targetRemaining;
      if (calculatedScored > 180 || IMPOSSIBLE_SCORES.indexOf(calculatedScored) !== -1) {
        alert('Detta innebär att spelaren kastat ' + calculatedScored + ' poäng, vilket är ett ogiltigt kast.');
        return;
      }
      showRemainingModal(targetRemaining, calculatedScored);
    }

    function processScore(score, confirmedCheckout) {
      saveStateToHistory();
      var m = activeMatch;
      var activePlayerName = m.turn === 'home' ? m.homePlayer : m.awayPlayer;
      var currentScore = m.turn === 'home' ? m.homeScore : m.awayScore;
      var newScore = currentScore - score;
      var isBust = false;
      if (newScore < 0 || newScore === 1 || (newScore === 0 && (IMPOSSIBLE_CHECKOUTS.indexOf(score) !== -1 || score > 170))) {
        isBust = true;
        newScore = currentScore;
      }
      if (score === 180 && !isBust) {
        m.performances.push({ id: Date.now(), team: m.turn, player: activePlayerName, text: '180' });
      }
      var entryData = { rawScore: score, score: isBust ? 'BUST' : score, remaining: newScore };
      if (m.turn === 'home') {
        m.rounds.push({ round: (m.rounds.length + 1) * 3, home: entryData, away: null });
        if (confirmedCheckout) {
          checkAndAddCheckoutPerformances('home', activePlayerName, score, m.rounds.length);
          m.homeLegs++;
          checkMatchWinOrNextLeg('home');
          return;
        }
        m.homeScore = newScore;
        m.turn = 'away';
      } else {
        if (m.rounds.length === 0) {
          m.rounds.push({ round: 3, home: null, away: entryData });
        } else if (m.rounds[m.rounds.length - 1].away === null) {
          m.rounds[m.rounds.length - 1].away = entryData;
        } else {
          m.rounds.push({ round: (m.rounds.length + 1) * 3, home: null, away: entryData });
        }
        if (confirmedCheckout) {
          checkAndAddCheckoutPerformances('away', activePlayerName, score, m.rounds.length);
          m.awayLegs++;
          checkMatchWinOrNextLeg('away');
          return;
        }
        m.awayScore = newScore;
        if (m.rounds.length === 13) {
          m.scoringActive = true;
          initScoringState();
          m.inputVal = '';
          renderJudgeUI();
          triggerLiveUpdate();
          return;
        }
        m.turn = 'home';
      }
      m.inputVal = '';
      renderJudgeUI();
      triggerLiveUpdate();
    }

    /* SCORING-MOMENT LOGIK MED MODAL */
    function handleScoringStepSubmit() {
      var m = activeMatch;
      if (!m || !m.scoringState) return;
      var val = parseInt(m.inputVal || '0', 10);
      if (isNaN(val) || val < 0 || val > 180 || IMPOSSIBLE_SCORES.indexOf(val) !== -1) {
        alert('Ange en giltig poäng mellan 0 och 180.');
        return;
      }
      var state = m.scoringState;
      state.queue[state.step].score = val;
      if (state.step < state.queue.length - 1) {
        state.step++;
        m.inputVal = '';
        renderScoringModal();
      } else {
        var totalHome = 0;
        var totalAway = 0;
        for (var i = 0; i < state.queue.length; i++) {
          if (state.queue[i].team === 'home') totalHome += state.queue[i].score;
          else totalAway += state.queue[i].score;
        }
        if (totalHome === totalAway) {
          alert('Det blev oavgjort i scoringen (' + totalHome + ' - ' + totalAway + ')! Kör om omgången.');
          state.step = 0;
          for (var k = 0; k < state.queue.length; k++) state.queue[k].score = null;
          m.inputVal = '';
          renderScoringModal();
          return;
        }
        var winnerTeam = totalHome > totalAway ? 'home' : 'away';
        var homeTeamName = fullMatchData ? fullMatchData.homeTeam : 'Hemmalag';
        var awayTeamName = fullMatchData ? fullMatchData.awayTeam : 'Bortalag';
        var winnerName = winnerTeam === 'home' ? homeTeamName : awayTeamName;
        showScoringWinnerModal(winnerTeam, winnerName, totalHome, totalAway);
      }
    }

    function handleUndoScoringStep() {
      var m = activeMatch;
      if (!m || !m.scoringState) return;
      if (m.scoringState.step > 0) {
        m.scoringState.step--;
        m.inputVal = m.scoringState.queue[m.scoringState.step].score !== null ? '' + m.scoringState.queue[m.scoringState.step].score : '';
        renderScoringModal();
      }
    }

    function showScoringWinnerModal(winnerTeam, winnerName, totalHome, totalAway) {
      var m = activeMatch;
      var modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.style.zIndex = '110';
      modal.innerHTML = 
        '<div class="modal-box" style="border: 3px solid #d97706;">' +
          '<div style="font-size: 40px; margin-bottom: 8px;">🔥</div>' +
          '<h3 style="font-size: 24px; margin-bottom: 8px;">Bekräfta Scoring-vinnare</h3>' +
          '<p style="color: var(--text-sub); font-size: 16px; margin-bottom: 12px;">' +
            'Hemmalag: <strong>' + totalHome + ' p</strong> | Bortalag: <strong>' + totalAway + ' p</strong>' +
          '</p>' +
          '<p style="color: var(--text-main); font-size: 18px; margin-bottom: 20px;">' +
            'Stämmer det att <strong style="color: #f59e0b;">' + winnerName + '</strong> vann leget?' +
          '</p>' +
          '<div style="display: flex; display: -webkit-flex;">' +
            '<button id="btn-sc-yes" style="width: 48%; margin-right: 4%; background-color: #10b981; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer;">JA (Tilldela leg)</button>' +
            '<button id="btn-sc-no" style="width: 48%; background-color: #dc2626; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer;">NEJ (Ändra)</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(modal);
      
      document.getElementById('btn-sc-yes').onclick = function() {
        document.body.removeChild(modal);
        if (winnerTeam === 'home') m.homeLegs++;
        else m.awayLegs++;
        m.scoringActive = false;
        m.scoringState = null;
        document.getElementById('scoring-modal-overlay').style.display = 'none';
        checkMatchWinOrNextLeg(winnerTeam);
      };
      
      document.getElementById('btn-sc-no').onclick = function() {
        document.body.removeChild(modal);
      };
    }

    function checkMatchWinOrNextLeg(winningTeam) {
      var m = activeMatch;
      if (m.homeLegs === 3 || m.awayLegs === 3) {
        var winnerName = winningTeam === 'home' ? getDisplayPlayerName('home', m.homePlayer) : getDisplayPlayerName('away', m.awayPlayer);
        var finalScoreStr = m.homeLegs + ' - ' + m.awayLegs;
        showMatchWinModal(winnerName, finalScoreStr);
      } else {
        startNextLeg();
      }
    }

    function showMatchWinModal(winnerName, scoreStr) {
      var modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.style.zIndex = '120';
      modal.innerHTML = 
        '<div class="modal-box" style="border: 3px solid #10b981;">' +
          '<div style="font-size: 48px; margin-bottom: 8px;">🏆</div>' +
          '<h3 style="font-size: 26px; margin-bottom: 12px;">MATCHEN SLUT!</h3>' +
          '<p style="color: var(--text-main); font-size: 20px; font-weight: bold; margin-bottom: 8px;">' +
            '<span style="color: #10b981;">' + winnerName + '</span> vann matchen med <span style="color: #f59e0b;">' + scoreStr + '</span>' +
          '</p>' +
          '<p style="color: var(--text-sub); font-size: 14px; margin-bottom: 24px;">Vill du spara resultat och gå till matchväljaren?</p>' +
          '<div style="display: flex; display: -webkit-flex;">' +
            '<button id="btn-win-ok" style="width: 48%; margin-right: 4%; background-color: #16a34a; color: #fff; border: none; padding: 18px; border-radius: 14px; font-size: 20px; font-weight: bold; cursor: pointer;">OK</button>' +
            '<button id="btn-win-undo" style="width: 48%; background-color: #dc2626; color: #fff; border: none; padding: 18px; border-radius: 14px; font-size: 20px; font-weight: bold; cursor: pointer;">Ångra</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(modal);
      document.getElementById('btn-win-ok').onclick = function() {
        document.body.removeChild(modal);
        if (fullMatchData && fullMatchData.subMatches[activeSubIndex]) {
          fullMatchData.subMatches[activeSubIndex].status = 'completed';
        }
        triggerLiveUpdate();
        showStartView();
      };
      document.getElementById('btn-win-undo').onclick = function() {
        document.body.removeChild(modal);
        handleUndo();
      };
    }

    function checkAndAddCheckoutPerformances(team, player, checkoutScore, roundsCount) {
      var totalDarts = roundsCount * 3;
      if (checkoutScore >= 100) {
        activeMatch.performances.push({ id: Date.now() + 1, team: team, player: player, text: checkoutScore + ' ut' });
      }
      if (totalDarts <= 15) {
        activeMatch.performances.push({ id: Date.now() + 2, team: team, player: player, text: totalDarts + ' pilars leg' });
      }
    }

    function startNextLeg() {
      var m = activeMatch;
      var nextStarter = m.legStarter === 'home' ? 'away' : 'home';
      m.homeScore = 501;
      m.awayScore = 501;
      m.rounds = [];
      m.historyStack = [];
      m.legStarter = nextStarter;
      m.turn = nextStarter;
      m.inputVal = '';
      m.scoringActive = false;
      m.scoringState = null;
      document.getElementById('scoring-modal-overlay').style.display = 'none';
      renderJudgeUI();
      triggerLiveUpdate();
    }

    function handleEditRound(index, team) {
      var m = activeMatch;
      var targetRound = m.rounds[index];
      var currentEntry = team === 'home' ? targetRound.home : targetRound.away;
      if (!currentEntry) return;
      var newValStr = prompt('Ändra kastad poäng för omgång ' + (index + 1) + ':', currentEntry.rawScore);
      if (newValStr === null) return;
      var newVal = parseInt(newValStr, 10);
      if (isNaN(newVal) || newVal < 0 || newVal > 180 || IMPOSSIBLE_SCORES.indexOf(newVal) !== -1) {
        alert('Ogiltig poäng.');
        return;
      }
      saveStateToHistory();
      if (team === 'home') targetRound.home.rawScore = newVal;
      else targetRound.away.rawScore = newVal;
      recalculateRoundsAndScores();
      renderJudgeUI();
      triggerLiveUpdate();
    }

    function recalculateRoundsAndScores() {
      var m = activeMatch;
      var currentHome = 501;
      var currentAway = 501;
      for (var i = 0; i < m.rounds.length; i++) {
        var r = m.rounds[i];
        if (r.home) {
          var s1 = r.home.rawScore;
          var rem1 = currentHome - s1;
          var isBust1 = rem1 < 0 || rem1 === 1 || (rem1 === 0 && (IMPOSSIBLE_CHECKOUTS.indexOf(s1) !== -1 || s1 > 170));
          if (isBust1) rem1 = currentHome;
          else currentHome = rem1;
          r.home = { rawScore: s1, score: isBust1 ? 'BUST' : s1, remaining: rem1 };
        }
        if (r.away) {
          var s2 = r.away.rawScore;
          var rem2 = currentAway - s2;
          var isBust2 = rem2 < 0 || rem2 === 1 || (rem2 === 0 && (IMPOSSIBLE_CHECKOUTS.indexOf(s2) !== -1 || s2 > 170));
          if (isBust2) rem2 = currentAway;
          else currentAway = rem2;
          r.away = { rawScore: s2, score: isBust2 ? 'BUST' : s2, remaining: rem2 };
        }
      }
      m.homeScore = currentHome;
      m.awayScore = currentAway;
    }

    function showCheckoutModal(score) {
      var m = activeMatch;
      var playerName = getDisplayPlayerName(m.turn, m.turn === 'home' ? m.homePlayer : m.awayPlayer);
      var modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = 
        '<div class="modal-box" style="border: 3px solid #10b981;">' +
          '<div style="font-size: 40px; margin-bottom: 8px;">🎯</div>' +
          '<h3 style="font-size: 24px; margin-bottom: 8px;">Gick spelaren ut?</h3>' +
          '<p style="color: var(--text-sub); font-size: 16px; margin-bottom: 20px;"><strong style="color: #059669;">' + playerName + '</strong> har knappat in <strong>' + score + '</strong>.</p>' +
          '<div style="display: flex; display: -webkit-flex;">' +
            '<button id="btn-yes" style="width: 48%; margin-right: 4%; background-color: #10b981; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer;">JA (Vann leg)</button>' +
            '<button id="btn-no" style="width: 48%; background-color: #dc2626; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer;">NEJ (Fel)</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(modal);
      document.getElementById('btn-yes').onclick = function() {
        document.body.removeChild(modal);
        processScore(score, true);
      };
      document.getElementById('btn-no').onclick = function() {
        document.body.removeChild(modal);
      };
    }

    function showRemainingModal(targetRemaining, calculatedScored) {
      var m = activeMatch;
      var playerName = getDisplayPlayerName(m.turn, m.turn === 'home' ? m.homePlayer : m.awayPlayer);
      var modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = 
        '<div class="modal-box" style="border: 3px solid #3b82f6;">' +
          '<h3 style="font-size: 22px; margin-bottom: 10px;">Sätt kvarvarande poäng</h3>' +
          '<p style="color: var(--text-sub); font-size: 16px; margin-bottom: 14px;">Sätt <strong style="color: var(--accent-home);">' + playerName + 's</strong> poäng till <strong style="color: var(--text-score); font-size: 22px;">' + targetRemaining + '</strong>?</p>' +
          '<p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px; background-color: var(--bg-item); padding: 8px; border-radius: 8px;">(Registrerar <strong>' + calculatedScored + '</strong> poäng)</p>' +
          '<div style="display: flex; display: -webkit-flex;">' +
            '<button id="btn-rem-yes" style="width: 48%; margin-right: 4%; background-color: #2563eb; color: #fff; border: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer;">JA (Sätt)</button>' +
            '<button id="btn-rem-no" style="width: 48%; background-color: var(--bg-item); color: var(--text-main); border: 1px solid var(--border-color); padding: 16px; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer;">NEJ</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(modal);
      document.getElementById('btn-rem-yes').onclick = function() {
        document.body.removeChild(modal);
        var currentScore = m.turn === 'home' ? m.homeScore : m.awayScore;
        var rem = currentScore - calculatedScored;
        if (rem === 0) {
          if (IMPOSSIBLE_CHECKOUTS.indexOf(calculatedScored) !== -1 || calculatedScored > 170) {
            processScore(calculatedScored, false);
            return;
          }
          showCheckoutModal(calculatedScored);
          return;
        }
        processScore(calculatedScored, false);
      };
      document.getElementById('btn-rem-no').onclick = function() {
        document.body.removeChild(modal);
      };
    }

    // ATOMIC MERGE: Hämta alltid senaste datan innan vi sparar
    function triggerLiveUpdate() {
      if (activeSubIndex === null || !activeMatch) return;
      document.getElementById('status-bar').innerText = 'Sparar...';

      // 1. Skapa lokal kopia av vår aktiva delmatch
      var mySubMatch = {
        homeScore: activeMatch.homeLegs,
        awayScore: activeMatch.awayLegs,
        currentHomePoints: activeMatch.homeScore,
        currentAwayPoints: activeMatch.awayScore,
        rounds: activeMatch.rounds,
        historyStack: activeMatch.historyStack,
        turn: activeMatch.turn,
        legStarter: activeMatch.legStarter,
        scoringActive: activeMatch.scoringActive,
        status: (activeMatch.homeLegs >= 3 || activeMatch.awayLegs >= 3) ? 'completed' : 'live'
      };

      var newPerfs = activeMatch.performances ? activeMatch.performances.slice() : [];
      activeMatch.performances = [];

      // 2. Hämta SENASTE datan från Supabase först
      apiCall('GET', '/rest/v1/matches?id=eq.main_match', null, function(err, res) {
        var latestData = (res && res.length > 0 && res[0].data) ? res[0].data : fullMatchData;
        
        // 3. Uppdatera BARA vår delmatch i det färska objektet
        if (latestData && latestData.subMatches && latestData.subMatches[activeSubIndex]) {
          var targetSm = latestData.subMatches[activeSubIndex];
          for (var key in mySubMatch) {
            targetSm[key] = mySubMatch[key];
          }
        }
        if (latestData) {
          if (latestData.matchStatus !== 'finished') latestData.matchStatus = 'ongoing';
          if (newPerfs.length > 0) {
            latestData.performances = (latestData.performances || []).concat(newPerfs);
          }
        }

        fullMatchData = latestData;

        // 4. Spara till Supabase
        var payload = {
          id: 'main_match',
          data: fullMatchData,
          updated_at: new Date().toISOString()
        };
        apiCall('POST', '/rest/v1/matches', payload, function(postErr) {
          if (!postErr) {
            document.getElementById('status-bar').innerText = 'Uppdaterat i realtid!';
          } else {
            document.getElementById('status-bar').innerText = 'Kunde inte spara: ' + postErr;
          }
        });
      });
    }

    function saveAndCloseMatch() {
      triggerLiveUpdate();
      showStartView();
    }

    loadMatchData();
    startPolling();
  </script>
