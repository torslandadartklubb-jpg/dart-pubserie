<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dart App - iOS 9 Vy</title>
  <!-- Polyfills för gamla Safari -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/7.12.1/polyfill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fetch/3.6.2/fetch.min.js"></script>
  <style>
    body { background-color: #020617; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .score { font-size: 40px; color: #fcd34d; font-weight: bold; }
    button { background: #2563eb; color: #fff; border: none; padding: 15px 25px; border-radius: 8px; font-size: 18px; cursor: pointer; margin: 5px; }
  </style>
</head>
<body>

  <h1>Dart Pubserie (iOS 9 Kompatibel)</h1>

  <div class="card">
    <h2 id="match-title">Laddar matchdata...</h2>
    <div class="score" id="match-score">0 - 0</div>
  </div>

  <button onclick="fetchData()">🔄 Uppdatera ställning</button>

  <script>
    var SUPABASE_URL = 'https://luznainkmcogcqbuprzw.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_6psZleJBdhdZFhUTutZqnw_Rr4Y2SI6';

    function fetchData() {
      fetch(SUPABASE_URL + '/rest/v1/matches?id=eq.main_match', {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data[0] && data[0].data) {
          var match = data[0].data;
          document.getElementById('match-title').innerText = match.homeTeam + ' vs ' + match.awayTeam;
          // Räkna poäng
          var homeWins = 0;
          var awayWins = 0;
          (match.subMatches || []).forEach(function(m) {
            if (m.homeScore === 3) homeWins++;
            if (m.awayScore === 3) awayWins++;
          });
          document.getElementById('match-score').innerText = homeWins + ' - ' + awayWins;
        }
      })
      .catch(function(err) {
        alert('Fel vid hämtning: ' + err.message);
      });
    }

    // Ladda data vid start
    fetchData();
    // Automatisk uppdatering var 5:e sekund
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
