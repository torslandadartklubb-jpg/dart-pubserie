<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dart Pubserie - iOS 9</title>
  <style>
    body {
      background-color: #020617;
      color: #ffffff;
      font-family: -apple-system, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
    }
    .score {
      font-size: 48px;
      color: #fcd34d;
      font-weight: bold;
      margin: 15px 0;
    }
    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 18px 30px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      display: inline-block;
      cursor: pointer;
      -webkit-appearance: none; /* Viktigt för iOS Safari knappar */
    }
    .status {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Dart Pubserie</h1>

  <div class="card">
    <h2 id="match-title">Hämtar data...</h2>
    <div class="score" id="match-score">0 - 0</div>
    <div class="status" id="last-updated">Status: Startar...</div>
  </div>

  <br>
  
  <button type="button" class="btn" id="refresh-btn">🔄 Uppdatera ställning</button>

  <script>
    var SUPABASE_URL = 'https://luznainkmcogcqbuprzw.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_6psZleJBdhdZFhUTutZqnw_Rr4Y2SI6';

    function loadData() {
      document.getElementById('last-updated').innerText = 'Status: Hämtar data...';
      
      // Använd gammal XMLHttpRequest (fungerar i ALLA gamla iOS-versioner)
      var xhr = new XMLHttpRequest();
      xhr.open('GET', SUPABASE_URL + '/rest/v1/matches?id=eq.main_match', true);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);

      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.length > 0 && data[0].data) {
                var match = data[0].data;
                document.getElementById('match-title').innerText = match.homeTeam + ' vs ' + match.awayTeam;
                
                var homeWins = 0;
                var awayWins = 0;
                var subMatches = match.subMatches || [];
                for (var i = 0; i < subMatches.length; i++) {
                  if (subMatches[i].homeScore === 3) homeWins++;
                  if (subMatches[i].awayScore === 3) awayWins++;
                }
                
                document.getElementById('match-score').innerText = homeWins + ' - ' + awayWins;
                document.getElementById('last-updated').innerText = 'Uppdaterad: ' + new Date().toLocaleTimeString();
              } else {
                document.getElementById('last-updated').innerText = 'Ingen matchdata hittades.';
              }
            } catch (e) {
              document.getElementById('last-updated').innerText = 'Tolkningsfel: ' + e.message;
            }
          } else {
            document.getElementById('last-updated').innerText = 'Serverfel HTTP ' + xhr.status;
          }
        }
      };

      xhr.onerror = function () {
        document.getElementById('last-updated').innerText = 'Nätverksfel vid anslutning till Supabase.';
      };

      xhr.send();
    }

    // Koppla klick-event via JavaScript i stället för onclick i HTML
    document.getElementById('refresh-btn').onclick = function() {
      loadData();
    };

    // Kör direkt när sidan laddas
    loadData();

    // Uppdatera automatiskt var 10:e sekund
    setInterval(loadData, 10000);
  </script>
</body>
</html>
